[workspace]
resolver = "2"
members = ["crates/near-protocol", "contracts/router", "backend"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
base64 = "0.22.1"
borsh = { version = "1.5.7", features = ["derive"] }
hex = "0.4.3"
near-account-id = { version = "3.0.0", features = ["serde", "borsh"] }
near-contract-standards = "5.30.0"
near-sdk = { version = "5.30.0", default-features = false }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
