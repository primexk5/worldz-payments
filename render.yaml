services:
  - type: web
    name: worldz-near-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: APP_HOST
        value: 0.0.0.0
      - key: APP_PORT
        value: "10000"
      - key: DATABASE_URL
        sync: false
      - key: AUTH_RECIPIENT
        value: https://worldz-payments.onrender.com
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: NEAR_TESTNET_ROUTER_ID
        sync: false
      - key: NEAR_TESTNET_FEE_RECIPIENT
        sync: false
      - key: NEAR_TESTNET_SIGNER_SEED_BASE64
        sync: false
      - key: NEAR_TESTNET_INDEXER_START_HEIGHT
        sync: false
      - key: NEAR_TESTNET_FT_ALLOWLIST
        sync: false
      - key: WEBHOOK_SIGNING_SECRET
        sync: false
  - type: web
    name: worldz-payments
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- --hostname 0.0.0.0
    healthCheckPath: /
    envVars:
      - key: NEXT_PUBLIC_NEAR_NETWORK_ID
        value: testnet
      - key: NEXT_PUBLIC_NEAR_RPC_URL
        value: https://near-testnet.drpc.org
      - key: NEXT_PUBLIC_NEAR_EXPLORER_URL
        value: https://testnet.nearblocks.io
      - key: NEXT_PUBLIC_NEAR_CONTRACT_ID
        value: router.newking.testnet
      - key: NEAR_BACKEND_URL
        fromService:
          type: web
          name: worldz-near-api
          property: host
