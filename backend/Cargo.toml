[package]
name = "worldz-near-api"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
aes-gcm = "0.10.3"
base64.workspace = true
borsh.workspace = true
bs58 = "0.5.1"
chrono = { version = "0.4.40", features = ["serde"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
dotenvy = "0.15.7"
hex.workspace = true
hmac = "0.12.1"
near-account-id.workspace = true
rand = "0.8.5"
reqwest = { version = "0.12.15", default-features = false, features = ["json", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle = "2.6"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "migrate", "macros"] }
thiserror.workspace = true
tokio = { version = "1.44.1", features = ["full"] }
tower-http = { version = "0.6.2", features = ["cors", "trace", "limit", "request-id"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt", "json"] }
url = "2.5.4"
uuid = { version = "1.16.0", features = ["v4", "serde"] }
worldz-near-protocol = { path = "../crates/near-protocol" }

[dev-dependencies]
http-body-util = "0.1.3"
tower = { version = "0.5.2", features = ["util"] }
