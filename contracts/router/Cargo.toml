[package]
name = "worldz-near-router"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
base64.workspace = true
borsh.workspace = true
hex.workspace = true
near-contract-standards.workspace = true
near-account-id.workspace = true
near-sdk = { workspace = true, features = ["legacy"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
worldz-near-protocol = { path = "../../crates/near-protocol" }

[dev-dependencies]
near-sdk = { workspace = true, features = ["legacy", "unit-testing"] }
ed25519-dalek = { version = "2.1.1", features = ["rand_core"] }
rand = "0.8.5"
anyhow = "1.0.98"
near-workspaces = "0.24.0"
tokio = { version = "1.44.1", features = ["macros", "rt-multi-thread", "time"] }
