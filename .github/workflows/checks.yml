name: Checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust, PostgreSQL recovery, and blockchain sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: worldz_test
          POSTGRES_PASSWORD: worldz_test
          POSTGRES_DB: worldz_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U worldz_test -d worldz_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      # Disposable CI-only database. Never use a deployment database here.
      SECURITY_TEST_DATABASE_URL: postgres://worldz_test:worldz_test@localhost:5432/worldz_test
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v4
      # Same compiler used for the reproduced proposal artifact; CI never deploys it.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          toolchain: nightly-2026-03-16
          components: rustfmt
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace --lib --bins
      - name: Fee rotation and delayed reconciliation evidence
        run: scripts/check-recovery.sh
      - name: Build router and mock token
        run: cargo build --locked -p worldz-near-router -p worldz-mock-nep141 --target wasm32-unknown-unknown --profile contract
      - name: Native and token blockchain sandbox
        env:
          WORLDZ_ROUTER_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/contract/worldz_near_router.wasm
          WORLDZ_MOCK_FT_WASM: ${{ github.workspace }}/target/wasm32-unknown-unknown/contract/worldz_mock_nep141.wasm
        run: cargo test --locked -p worldz-near-router --test sandbox -- --nocapture
      - name: Publish recovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-evidence
          path: target/evidence/
          if-no-files-found: warn

  frontend:
    name: Frontend tests, types, lint, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      # LayoutProps is generated by Next.js and is absent in a fresh checkout.
      - run: npx next typegen
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run build
